name: tests

# The same three suites that are run before every change: the Python reference (with the JavaScript port, the
# Rust core's C interface and the core built as WebAssembly checked against it), the Rust core's own tests, and the
# Julia package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"        # Mondays: catches a new compiler, Python or Julia that breaks something

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13", coverage: true }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the Rust core
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          cargo build --release --features jpeg,png --manifest-path core/Cargo.toml
      - name: Install
        run: python -m pip install -e ".[test]" pytest-cov
      - name: Valgrind, for the memory check of the C host
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Test
        run: python -m pytest -q -rs ${{ matrix.coverage && '--cov=udeep --cov-report=xml' || '' }}
      - name: Coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup update stable
      - name: Test, with coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.1
          cargo llvm-cov --release --features jpeg,png --manifest-path core/Cargo.toml --lcov --output-path lcov.info
      - name: Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Clippy
        run: cargo clippy --release --features jpeg,png --manifest-path core/Cargo.toml -- -D warnings
      - name: Clippy, built as WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --release --target wasm32-unknown-unknown --features jpeg,png --manifest-path core/Cargo.toml -- -D warnings
      - name: Dependencies (known vulnerabilities, licences, sources; core/deny.toml)
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --manifest-path core/Cargo.toml check

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]" markdown
      - name: Rebuild everything that is generated, and compare
        run: python tools/build_all.py --check

  miri:
    name: C interface under Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: Stress tests of the C interface, checked for undefined behaviour and leaks
        env:
          MIRIFLAGS: -Zmiri-deterministic-floats -Zmiri-strict-provenance
        run: cargo +nightly miri test --manifest-path core/Cargo.toml --test ffi_stress

  julia:
    name: Julia package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Build the Rust core
        run: |
          rustup update stable
          cargo build --release --features jpeg,png --manifest-path core/Cargo.toml
      - name: Test, with coverage
        run: julia --project=julia/UDeepCore -e 'using Pkg; Pkg.test(coverage=true)'
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        with:
          directories: julia/UDeepCore/src,julia/UDeepCore/ext
      - name: Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
