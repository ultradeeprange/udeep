name: tests

# The same three suites that are run before every change: the Python reference (with the JavaScript port and the
# Rust core's C interface checked against it), the Rust core's own tests, and the Julia package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Rust core
        run: |
          rustup update stable
          cargo build --release --features jpeg,png --manifest-path core/Cargo.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q -rs

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - name: Test
        run: cargo test --release --features jpeg,png --manifest-path core/Cargo.toml
      - name: Clippy
        run: cargo clippy --release --features jpeg,png --manifest-path core/Cargo.toml -- -D warnings

  julia:
    name: Julia package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Build the Rust core
        run: |
          rustup update stable
          cargo build --release --features jpeg,png --manifest-path core/Cargo.toml
      - name: Test
        run: julia --project=julia/UDeepCore -e 'using Pkg; Pkg.test()'
