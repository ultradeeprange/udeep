name: wheels

# Builds the installable packages: one wheel per platform that carries the Rust core (py3-none-<platform>: the core
# is loaded with ctypes, so the wheel serves every Python 3), and the source distribution. Each wheel is installed
# into a clean environment and checked there, without the source tree (pyproject.toml, [tool.cibuildwheel]).
#
# The core library is also taken out of each wheel and packed alone (tools/core_tarball.py), for the Julia package:
# with those archives at a public address, tools/julia_artifacts.jl writes the package's Artifacts.toml.
#
# On a version tag the packages are attached to a DRAFT release on GitHub, for a person to look at and publish.
# Nothing is uploaded to PyPI from here.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["setup.py", "pyproject.toml", "MANIFEST.in", "core/**", "tools/check_wheel.py", "tools/core_tarball.py", ".github/workflows/wheels.yml"]

permissions:
  contents: read

jobs:
  wheel:
    name: Wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (the Linux build installs its own, inside its container)
        if: runner.os != 'Linux'
        run: rustup update stable
      - uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
      - name: The wheel is for any Python 3 and carries the core
        shell: bash
        run: |
          ls -l wheelhouse
          test "$(ls wheelhouse/*.whl | wc -l | tr -d " ")" = 1
          ls wheelhouse/udeep-*-py3-none-*.whl
          python -m zipfile -l wheelhouse/*.whl | grep -E "udeep/_lib/(libudeep_core\.(so|dylib)|udeep_core\.dll)"
      - name: The core alone, packed for the Julia package
        shell: bash
        run: |
          python tools/core_tarball.py wheelhouse/*.whl --out corehouse
          ls -l corehouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.os }}
          path: corehouse/*.tar.gz
          if-no-files-found: error

  sdist:
    name: Source distribution, installed without Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # Every file from PyPI is checked against its hash (.github/requirements/build.txt): the build tools, and the
      # package's dependencies in each environment it is installed into. The sdist is built into a wheel there, by
      # the environment's own setuptools, and that wheel installed, as pip would install the sdist itself.
      - name: Build
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --sdist --no-isolation
      - name: The package's page on PyPI will render (its README and metadata)
        run: python -m twine check --strict dist/*
      - name: Install with no cargo, and check that the package falls back to NumPy and Pillow
        run: |
          python -m venv /tmp/pure
          /tmp/pure/bin/python -m pip install --require-hashes -r .github/requirements/build.txt
          UDEEP_BUILD_CORE=0 /tmp/pure/bin/python -m pip wheel --no-deps --no-build-isolation -w /tmp/pure-wheel dist/*.tar.gz
          /tmp/pure/bin/python -m pip install --no-deps /tmp/pure-wheel/*.whl
          cd /tmp && /tmp/pure/bin/python "$GITHUB_WORKSPACE/tools/check_wheel.py" --pure
      - name: Install with cargo, and check that the source distribution builds the core
        run: |
          python -m venv /tmp/built
          /tmp/built/bin/python -m pip install --require-hashes -r .github/requirements/build.txt
          UDEEP_BUILD_CORE=1 /tmp/built/bin/python -m pip wheel --no-deps --no-build-isolation -w /tmp/built-wheel dist/*.tar.gz
          /tmp/built/bin/python -m pip install --no-deps /tmp/built-wheel/*.whl
          cd /tmp && /tmp/built/bin/python "$GITHUB_WORKSPACE/tools/check_wheel.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Each package installed as a newcomer would, on machines that have never seen it: a fresh environment, the pip
  # that comes with that Python, the dependencies from PyPI, and nothing of this repository but the one script that
  # does it (tools/first_install.py), which then runs `python -m udeep.selftest` from an empty folder. A platform
  # with no wheel gets the source distribution, built there, with the core if Rust happens to be installed.
  first-install:
    name: First install, ${{ matrix.name }}
    needs: [wheel, sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 24.04, Python 3.13", os: ubuntu-24.04, python: "3.13", expect: "--expect-core" }
          - { name: "Ubuntu 24.04, Python 3.14", os: ubuntu-24.04, python: "3.14", expect: "--expect-core" }
          - { name: "Ubuntu 22.04, Python 3.13", os: ubuntu-22.04, python: "3.13", expect: "--expect-core" }
          - { name: "Windows, Python 3.13", os: windows-latest, python: "3.13", expect: "--expect-core" }
          - { name: "Windows, Python 3.14", os: windows-latest, python: "3.14", expect: "--expect-core" }
          - { name: "Ubuntu 24.04, Python 3.14 free-threaded", os: ubuntu-24.04, python: "3.14t", expect: "--expect-core" }
          - { name: "Windows, Python 3.14 free-threaded", os: windows-latest, python: "3.14t", expect: "--expect-core" }
          - { name: "macOS 14, Apple silicon, Python 3.13", os: macos-14, python: "3.13", expect: "--expect-core" }
          - { name: "macOS 15, Apple silicon, Python 3.14", os: macos-15, python: "3.14", expect: "--expect-core" }
          - { name: "macOS 15, Intel, Python 3.13", os: macos-15-intel, python: "3.13", expect: "--expect-core" }
          - { name: "Linux on ARM, no wheel", os: ubuntu-24.04-arm, python: "3.13", expect: "" }
          - { name: "Windows on ARM, no wheel", os: windows-11-arm, python: "3.13", expect: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tools/first_install.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist
      - name: Install and run, as a newcomer would
        shell: bash
        run: python tools/first_install.py --packages dist ${{ matrix.expect }} --json first-install.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: first-install-${{ matrix.os }}-${{ matrix.python }}
          path: first-install.json
          if-no-files-found: warn

  # The same on Linux systems as their users have them, each in its own container: Debian with the Python
  # project's image, Ubuntu and Fedora with the system's own Python, and Alpine, whose musl C library no wheel
  # here is built for. Ubuntu 24.04's own Python, 3.12, is older than udeep supports: there pip must refuse it and
  # say why.
  first-install-linux:
    name: First install, ${{ matrix.name }}
    needs: [wheel, sdist]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13, Python 3.13
            image: python:3.13-slim-trixie@sha256:4873c73fa393882cf10f9d1054c928e95201c1559ca2107c1589786ece10f49f
            setup: "true"
            expect: "--expect-core"
          - name: Ubuntu 26.04, its own Python
            image: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
            setup: "apt-get update -qq && apt-get install -y -qq python3 python3-venv > /dev/null"
            expect: "--expect-core"
          - name: Ubuntu 24.04, its own Python 3.12, refused
            image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
            setup: "apt-get update -qq && apt-get install -y -qq python3 python3-venv > /dev/null"
            expect: "--expect-refused"
          - name: Fedora 42, its own Python
            image: fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
            setup: "dnf install -y -q python3"
            expect: "--expect-core"
          - name: Alpine (musl), no wheel
            image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
            setup: "true"
            expect: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tools/first_install.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist
      - name: Install and run, as a newcomer would
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          EXPECT: ${{ matrix.expect }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e SETUP -e EXPECT "$IMAGE" \
            sh -c 'eval "$SETUP" && python3 tools/first_install.py --packages dist $EXPECT --json first-install.json'

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, sdist, first-install, first-install-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the packages to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" \
            --notes "Packages built by the wheels workflow. See CHANGELOG.md for what changed."
