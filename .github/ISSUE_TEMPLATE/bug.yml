name: Fault in the tools
description: Something the code does wrong, or a file it writes that is wrong.
title: "Fault: "
labels: ["fault"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got. Paste the full error if there was one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: The smallest code that shows it
      description: Synthetic data is best; a few lines of NumPy are usually enough.
      render: python
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The commit of this repository, your language version (Python, Julia or Rust) and your operating system.
      placeholder: "commit 1a2b3c4; Python 3.13; Windows 11"
    validations:
      required: true
  - type: dropdown
    id: core
    attributes:
      label: Was the Rust core in use?
      description: "In Python: `import udeep.core as c; print(c.enabled())`."
      options: ["yes", "no", "not known", "not applicable"]
    validations:
      required: true
